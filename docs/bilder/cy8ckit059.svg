<text x="84" y="444" text-anchor="start" fill="#1f2937" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400">Används för att FLASHA firmware.</text>
<text x="84" y="464" text-anchor="start" fill="#1f2937" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400">Stick USB-A direkt i datorn (ingen kabel).</text>
<text x="84" y="484" text-anchor="start" fill="#1f2937" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400">PSoC Programmer hittar ”KitProg”.</text>
<text x="84" y="504" text-anchor="start" fill="#1f2937" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400">Matar inte analogkortet i drift.</text>
