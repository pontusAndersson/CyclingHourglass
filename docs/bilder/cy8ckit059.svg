<text x="614" y="444" text-anchor="start" fill="#1f2937" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400">Används i DRIFT: ström + COM-port till datorn.</text>
<text x="614" y="464" text-anchor="start" fill="#1f2937" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400">Sitter i analogkortet (PDIA).</text>
<text x="614" y="484" text-anchor="start" fill="#1f2937" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400">Flashar inte firmware.</text>
<text x="614" y="504" text-anchor="start" fill="#1f2937" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400">Brutna isär? Koppla 5 SWD-stift 1:1 (gula).</text>
